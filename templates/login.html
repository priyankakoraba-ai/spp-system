{% extends 'base.html' %}{% block public %}<div class="auth-page">
    <div class="auth-card">
        <div class="big-cap" aria-hidden="true">🎓</div>
        <h1>Student Performance<br>Prediction System</h1>
        <p>Login to your account</p>
        <form method="post"><label>Username <em>*</em> <input name="username" placeholder="Username" required></label>
            <label>Password <em>*</em> <input type="password" name="password" placeholder="Password"
                    required></label><button class="btn full">Login</button>
        </form>
        <div class="auth-links auth-recovery">
            <div> &nbsp;&nbsp;•&nbsp;&nbsp;<a href="{{url_for('forgot_password')}}">Forgot Password?</a></div><br>
            <div>•&nbsp;&nbsp;<a href="{{url_for('forgot_username')}}">Know Your Username</a></div>&nbsp;&nbsp;
        </div>
        <small>Don't have an account? <a href="{{url_for('register')}}">Register</a></small>
    </div>
</div>{% endblock %}
