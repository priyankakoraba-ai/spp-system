{% extends 'base.html' %}{% block public %}<div class="auth-page">
    <div class="auth-card">
        <div class="big-cap" aria-hidden="true">🎓</div>
        <h1>Create Account</h1>
        <p>Register before logging in</p>
        <form method="post"><input name="name" placeholder="Full Name" required><input name="username"
                placeholder="Username" required><input type="password" name="password" minlength="6"
                placeholder="Password" required><input type="password" name="confirm_password" minlength="6"
                placeholder="Confirm Password" required><button class="btn full">Register</button></form><small>Already
            have an account? <a href="{{url_for('login')}}">Login</a></small>
    </div>
</div>{% endblock %}
