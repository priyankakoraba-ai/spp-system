{% extends 'base.html' %}
{% block content %}
<section class="auth-wrap" style="max-width: 440px; margin: 3rem auto; background: #fff; border-radius: 14px; padding: 2rem; box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08); border-top: 4px solid #1e3a8a;">
  <div style="text-align: center; margin-bottom: 1.5rem;">
    <span style="display: inline-block; background: #eff6ff; color: #1e3a8a; font-weight: 700; font-size: 0.78rem; padding: 4px 12px; border-radius: 999px; letter-spacing: 0.04em; text-transform: uppercase;">
      Restricted Portal
    </span>
    <h2 style="margin: 0.6rem 0 0.3rem; color: #0f172a;">Head Admin Login</h2>
    <p style="margin: 0; color: #64748b; font-size: 0.9rem;">Sign in with administrator credentials to manage users and records.</p>
  </div>

  <form method="POST" action="{{ url_for('admin_login') }}" style="display: flex; flex-direction: column; gap: 1rem;">
    <div>
      <label style="display: block; font-weight: 600; margin-bottom: 5px; color: #334155;">Admin Username</label>
      <input type="text" name="username" value="admin" required style="width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box;">
    </div>
    <div>
      <label style="display: block; font-weight: 600; margin-bottom: 5px; color: #334155;">Password</label>
      <input type="password" name="password" placeholder="Enter admin password" required style="width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box;">
    </div>
    <button type="submit" style="background: #1e3a8a; color: #fff; border: none; padding: 11px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.95rem; margin-top: 0.3rem;">
      Sign In as Admin →
    </button>
  </form>

  <div style="margin-top: 1.2rem; text-align: center; font-size: 0.85rem; color: #64748b;">
    Standard user or university? <a href="{{ url_for('login') }}" style="color: #2563eb; font-weight: 600; text-decoration: none;">Regular Login</a>
  </div>
</section>
{% endblock %}
