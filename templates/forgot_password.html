{% extends 'base.html' %}
{% block public %}
<div class="auth-page">
  <div class="auth-card">
    <div class="big-cap" aria-hidden="true">🎓</div>
    <h1>Forgot Password?</h1>
    <p>Verify your account using your username and registered full name before setting a new password.</p>
    <form method="post">
      <label>👤 <input name="username" autocomplete="username" placeholder="Username" required></label>
      <label>🧑 <input name="registered_name" autocomplete="name" placeholder="Registered Full Name" required></label>
      <label>🔒 <input type="password" name="new_password" minlength="6" autocomplete="new-password" placeholder="New Password" required></label>
      <label>🔒 <input type="password" name="confirm_password" minlength="6" autocomplete="new-password" placeholder="Confirm New Password" required></label>
      <button class="btn full">Reset Password</button>
    </form>
    <div class="auth-links auth-links-left">
      <a href="{{url_for('forgot_username')}}">Know Your Username?</a>
    </div>
    <small><a href="{{url_for('login')}}">← Back to Login</a></small>
  </div>
</div>
{% endblock %}
